<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" role="img" aria-label="Extra context tokens sloptrim adds to a session, by number of model calls. Full and strict add about 1,400 tokens per call, lite about 1,120, off none.">
<style>.bg{fill:#fcfcfb}.ink{fill:#1f1f1e}.mut{fill:#6b6b68}.grid{stroke:#e4e4e1}.ax{stroke:#b9b9b5}.s1{stroke:#2a78d6}.s2{stroke:#d9622b}.d1{fill:#2a78d6}.d2{fill:#d9622b}text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#1a1a19}.ink{fill:#ececea}.mut{fill:#a3a39f}.grid{stroke:#32322f}.ax{stroke:#5a5a56}.s1{stroke:#4a8be0}.s2{stroke:#de7038}.d1{fill:#4a8be0}.d2{fill:#de7038}}</style>
<rect class="bg" width="760" height="488"/>
<text class="ink" x="24" y="30" font-size="17" font-weight="600">What sloptrim adds to a session</text>
<text class="mut" x="24" y="48" font-size="12.5">Extra context tokens re-read, by number of model calls. Off adds nothing.</text>
<line class="grid" x1="70" x2="600" y1="340.0" y2="340.0"/>
<text class="mut" x="62" y="344.0" font-size="11.5" text-anchor="end">0</text>
<line class="grid" x1="70" x2="600" y1="308.9" y2="308.9"/>
<text class="mut" x="62" y="312.9" font-size="11.5" text-anchor="end">50k</text>
<line class="grid" x1="70" x2="600" y1="277.8" y2="277.8"/>
<text class="mut" x="62" y="281.8" font-size="11.5" text-anchor="end">100k</text>
<line class="grid" x1="70" x2="600" y1="246.7" y2="246.7"/>
<text class="mut" x="62" y="250.7" font-size="11.5" text-anchor="end">150k</text>
<line class="grid" x1="70" x2="600" y1="215.6" y2="215.6"/>
<text class="mut" x="62" y="219.6" font-size="11.5" text-anchor="end">200k</text>
<line class="grid" x1="70" x2="600" y1="184.4" y2="184.4"/>
<text class="mut" x="62" y="188.4" font-size="11.5" text-anchor="end">250k</text>
<line class="grid" x1="70" x2="600" y1="153.3" y2="153.3"/>
<text class="mut" x="62" y="157.3" font-size="11.5" text-anchor="end">300k</text>
<line class="grid" x1="70" x2="600" y1="122.2" y2="122.2"/>
<text class="mut" x="62" y="126.2" font-size="11.5" text-anchor="end">350k</text>
<line class="grid" x1="70" x2="600" y1="91.1" y2="91.1"/>
<text class="mut" x="62" y="95.1" font-size="11.5" text-anchor="end">400k</text>
<line class="grid" x1="70" x2="600" y1="60.0" y2="60.0"/>
<text class="mut" x="62" y="64.0" font-size="11.5" text-anchor="end">450k</text>
<line class="ax" x1="70.0" x2="70.0" y1="340" y2="344"/>
<text class="mut" x="70.0" y="358" font-size="11.5" text-anchor="middle">0</text>
<line class="ax" x1="158.3" x2="158.3" y1="340" y2="344"/>
<text class="mut" x="158.3" y="358" font-size="11.5" text-anchor="middle">50</text>
<line class="ax" x1="246.7" x2="246.7" y1="340" y2="344"/>
<text class="mut" x="246.7" y="358" font-size="11.5" text-anchor="middle">100</text>
<line class="ax" x1="335.0" x2="335.0" y1="340" y2="344"/>
<text class="mut" x="335.0" y="358" font-size="11.5" text-anchor="middle">150</text>
<line class="ax" x1="423.3" x2="423.3" y1="340" y2="344"/>
<text class="mut" x="423.3" y="358" font-size="11.5" text-anchor="middle">200</text>
<line class="ax" x1="511.7" x2="511.7" y1="340" y2="344"/>
<text class="mut" x="511.7" y="358" font-size="11.5" text-anchor="middle">250</text>
<line class="ax" x1="600.0" x2="600.0" y1="340" y2="344"/>
<text class="mut" x="600.0" y="358" font-size="11.5" text-anchor="middle">300</text>
<line class="ax" x1="70" x2="600" y1="340" y2="340"/>
<text class="mut" x="335" y="376" font-size="11.5" text-anchor="middle">model calls in the session</text>
<line class="s1" stroke-width="2" stroke-linecap="round" x1="70" y1="340" x2="600" y2="78.7"/>
<circle class="d1" cx="600" cy="78.7" r="4"/>
<text class="ink" x="612" y="76.7" font-size="12.5" font-weight="600">full / strict</text>
<text class="mut" x="612" y="91.7" font-size="11.5">about 1,400 tokens × calls</text>
<line class="s2" stroke-width="2" stroke-linecap="round" x1="70" y1="340" x2="600" y2="130.9"/>
<circle class="d2" cx="600" cy="130.9" r="4"/>
<text class="ink" x="612" y="128.9" font-size="12.5" font-weight="600">lite</text>
<text class="mut" x="612" y="143.9" font-size="11.5">about 1,120 tokens × calls</text>
<text class="ink" x="24" y="402" font-size="12">Add for each subagent: 1,400 × its own calls. Each prompt: about 20 × calls. Each flagged save: about 50 × calls.</text>
<text class="ink" x="24" y="420" font-size="12">Cost = tokens ÷ 1,000,000 × your cache-read price. 100 calls on full is about 140,000 tokens.</text>
<text class="mut" x="24" y="438" font-size="12">This is the floor. An expired cache is rewritten at the cache-write price, and a compaction injects the text again.</text>
<text class="mut" x="24" y="456" font-size="12">Strict injects the same text as full. It flags at 20 instead of 40, so it asks for more rewrites.</text>
<text class="mut" x="24" y="474" font-size="12">Start figures measured as billed input tokens on Claude Haiku, off against on; other models count a little differently.</text>
</svg>